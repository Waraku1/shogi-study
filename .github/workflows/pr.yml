name: PR checks
on:
  pull_request:
    branches: [main, feat/spike-01-shogi-wasm, feat/phase-2-auth-online]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The standard Ubuntu runner already includes Chrome; no browser download,
      # deployment credentials, artifact upload or release preparation needed.
      - run: pnpm test:browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: pnpm test:online
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          WRANGLER_SEND_METRICS: false
